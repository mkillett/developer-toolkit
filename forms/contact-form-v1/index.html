<link rel="stylesheet" href="styles.css">

<!-- Professional Contact Form v1.0 -->
<!-- Reusable component -->

      <form
        class="contact-form"
        id="contactForm"
        action="https://formspree.io/f/mlgqakyp"
        method="POST"
        enctype="multipart/form-data"
      >
        <input
          type="hidden"
          name="subject"
          value="New Proposal Request - Backbay Commercial - {{ name }}"
        >

        <input
          type="text"
          name="_gotcha"
          style="display:none"
          tabindex="-1"
          autocomplete="off"
          >

        <label>Name<input required name="Primary Contact" autocomplete="name"></label>
        <label>Company<input required name="Company / Organization" autocomplete="organization"></label>
        <label>Email<input required type="email" name="_replyto" autocomplete="email"></label>
        <label>
          Phone
          <input
          type="tel"
          id="phone" name="phone"
          autocomplete="tel"
          inputmode="numeric"
          maxlength="14"
          placeholder="(###) ###-####"
        >
      </label>
      
    <label class="full-width">
      Project Address
      <input
        type="text"
        id="projectAddress"
        name="Project Site Address"
        placeholder="Start typing the project address..."
        autocomplete="off"
        required
      >
    </label>

        <label>
          Division
          <select name="Requested Division" required>
            <option value="" selected disabled>Select a division</option>
            <option value="southwest-florida—construction">
                Southwest Florida - Construction
            </option>
            <option value="central-florida-service">
              Central Florida - Service
            </option>
            <option value="not-sure">
              Not Sure
           </option>
          </select>
        </label>

        <label>Project Type
          <select name="Requested Service" required>
            <option value="" selected disabled>Select a project type</option>
            <option> Tenant Build-Out</option>
            <option>Commercial Service Call</option>
            <option>Lighting Upgrade</option>
            <option>Electrical Distribution</option>
            <option>Preventative Maintenance</option>
            <option>Generator Installation</option>
            <option>EV Charging</option>
            <option>Emergency Service</option>
          </select>
        </label>

        <label>Estimated Budget
        <select name="Estimated Budget" required>
            <option value="" selected disabled>Select an estimated budget</option>
            <option>Under $5,000</option>
            <option>$5,000 - $10,000</option>
            <option>$10,000 - $25,000</option>
            <option>$25,000 - $50,000</option>
            <option>$50,000 - $100,000</option>
            <option>Other</option>
        </Select>
        </label>
        <label>Preferred Start
            <select name="Preferred Start" required>
              <option value="" selected disabled>Select a preferred start</option>
              <option>Emergency</option>
              <option>Within 30 Days</option>
              <option>1-3 Months</option>
              <option>Flexible</option>
            </select>
        </label>
        <label>Requested Completion Date<input type="date" name="Target Completion Date" required></label>

        <label class="full-width">Project Scope / Existing Condtions
          <textarea
            required
            name="Project Scope"
            rows="7"></textarea>

          <p class="fields-helper">
            Please include:
            <br>• Scope of work
            <br>• Existing electrical issue (if applicable)
            <br>• Building occupancy status 
            <br>• Desired completion date or deadline 
            <br>• Any special scheduling requirements
          </p>
      </label>

        <label class="full-width">
          Upload Plans or Photos
          <input
            type="file"
            id="projectFiles"
            name="projectFiles"
            accept=".pdf, .jpg, .jpeg, .png"
            multiple
          >
          <p class="file-status" id="fileStatus">
            No files selected
          </p>
      </label>

        <button 
          class="button button-primary"
          id="submitButton"
          type="submit"
        >
          Submit Request
        </button>

        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
      
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAD2OtqkIc4YKEWtveFCoQMt5YICN5R0xI&libraries=places"></script>

      <script src="script.js"></script>
